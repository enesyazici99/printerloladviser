name: Deploy to GitHub Pages

# Builds the static site from the last data snapshot and publishes it.
# Runs on every push to main and whenever the data refresh has saved new data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project pages live under /<repository name>/ on the account's Pages domain.
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
  NEXT_PUBLIC_SITE_ORIGIN: https://ygappstudio.com # this account's Pages custom domain
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The generated JSON is not part of the source tree.
      - name: Restore data snapshot
        run: bash scripts/ci/snapshot.sh restore

      - name: Check that data exists
        run: test -f public/data/meta.json && test -f public/data/draft.json && test -f public/data/static/en.json

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The match database is pipeline state, not something the site reads.
      - run: rm -rf out/data/db && touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
